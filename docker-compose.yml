version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sports_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sports_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sports_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # NestJS REST API Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sports_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/sports_analytics?schema=public"
      JWT_SECRET: "sports_analytics_super_secret_jwt_key_2026"
      JWT_EXPIRES_IN: "7d"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Next.js Web Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sports_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
      NODE_ENV: "production"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
